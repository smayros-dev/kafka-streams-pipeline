# Async Minion Configuration
quarkus.http.port=8081
quarkus.log.level=DEBUG
quarkus.log.console.level=DEBUG

# Microcks API connection
io.github.microcks.minion.async.client.MicrocksAPIConnector/mp-rest/url=http://microcks:8080
microcks.serviceaccount.name=microcks-serviceaccount
microcks.serviceaccount.credentials=f3674e4a-5696-437f-b201-598d06b32b01

# Async features
async-api.default-binding=KAFKA
async-api.default-frequency=5

# Kafka connection
kafka.bootstrap.servers=kafka:29092

# Override per-channel bootstrap.servers (built-in defaults to localhost:9092)
mp.messaging.connector.smallrye-kafka.bootstrap.servers=kafka:29092
mp.messaging.incoming.microcks-services-updates.bootstrap.servers=kafka:29092
mp.messaging.incoming.microcks-asyncapi-triggers.bootstrap.servers=kafka:29092

# Disable Kafka health probe (avoids localhost check)
quarkus.kafka.health.enabled=false
