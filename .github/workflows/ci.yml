name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kstream-service:
    name: KStream Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kstream-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Checkstyle
        run: mvn checkstyle:check -q
      - name: Unit Tests
        run: mvn test -Dtest=KStreamApplicationTest -q
      - name: Code Coverage
        run: mvn jacoco:report -q

  api-service:
    name: API Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Build
        run: mvn compile -q
      - name: Test
        id: test
        run: mvn test -Dtest=StatsContratControllerTest 2>&1 | tee api-service/test-output.log; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Upload logs
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: api-service-test-logs
          path: api-service/test-output.log
      - name: Fail if test failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
