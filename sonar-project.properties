# SonarQube Configuration for Data Dammages

## Environment Variables

Set the following environment variables before running SonarQube analysis:

```bash
export SONAR_HOST_URL=http://localhost:9000
export SONAR_TOKEN=your-sonar-token-here
```

## Running SonarQube Analysis

### kstream-service

```bash
mvn clean verify sonar:sonar -Psonar -f kstream-service/pom.xml
```

### api-service

```bash
mvn clean verify sonar:sonar -Psonar -f api-service/pom.xml
```

### All Services

```bash
mvn clean verify sonar:sonar -Psonar -f kstream-service/pom.xml
mvn clean verify sonar:sonar -Psonar -f api-service/pom.xml
```

## Project Keys

| Service | Project Key |
|---------|-------------|
| kstream-service | caa-dammages-kstream-service |
